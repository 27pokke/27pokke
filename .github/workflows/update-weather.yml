name: Update Weather in README

on:
  schedule:
    # 07:00 JST
    - cron: '0 22 * * *'
  workflow_dispatch:

concurrency:
  group: update-weather-readme
  cancel-in-progress: false

permissions:
  contents: write

env:
  CITY: "${{ secrets.OPENWEATHER_CITY || 'Tokyo,JP' }}"
  UNITS: metric
  OWM_LANG: ja

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch weather (OpenWeatherMap)
        shell: bash
        env:
          OPENWEATHER_API_KEY: "${{ secrets.OPENWEATHER_API_KEY }}"
        run: |
          set -euo pipefail

          if [[ -z "${OPENWEATHER_API_KEY:-}" ]]; then
            echo "::error title=Missing secret::Repository secret OPENWEATHER_API_KEY is not configured."
            exit 1
          fi

          if ! RESP="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --retry 3 \
              --retry-delay 2 \
              --retry-max-time 20 \
              --connect-timeout 10 \
              --max-time 30 \
              --get "https://api.openweathermap.org/data/2.5/weather" \
              --data-urlencode "q=${CITY}" \
              --data-urlencode "appid=${OPENWEATHER_API_KEY}" \
              --data-urlencode "units=${UNITS}" \
              --data-urlencode "lang=${OWM_LANG}"
          )"; then
            MESSAGE="$(jq -r '.message // empty' <<<"${RESP}" 2>/dev/null || true)"
            echo "::error title=Weather API request failed::OpenWeatherMap did not return a successful response."
            if [[ -n "${MESSAGE}" ]]; then
              MESSAGE="${MESSAGE//$'\r'/ }"
              MESSAGE="${MESSAGE//$'\n'/ }"
              printf 'OpenWeatherMap message: %s\n' "${MESSAGE}"
            fi
            exit 1
          fi

          if ! jq -e 'type == "object"' >/dev/null <<<"${RESP}"; then
            echo "::error title=Invalid API response::OpenWeatherMap returned invalid JSON."
            exit 1
          fi

          CODE="$(jq -r '.cod // 200' <<<"${RESP}")"
          if [[ -n "$CODE" && "$CODE" != "200" ]]; then
            echo "::error title=Weather API error::OpenWeatherMap returned an API error."
            exit 1
          fi

          NAME="$(jq -er '.name' <<<"${RESP}")"
          DESC="$(jq -er '.weather[0].description' <<<"${RESP}")"
          TEMP="$(jq -er '.main.temp | floor' <<<"${RESP}")"
          FEELS="$(jq -er '.main.feels_like | floor' <<<"${RESP}")"
          HUMI="$(jq -er '.main.humidity' <<<"${RESP}")"
          WIND="$(jq -er '.wind.speed' <<<"${RESP}")"
          ICON="$(jq -er '.weather[0].icon' <<<"${RESP}")"

          EMOJI="⛅"
          case "$ICON" in
            01*) EMOJI="☀️" ;; # clear
            02*) EMOJI="🌤️" ;;
            03*|04*) EMOJI="☁️" ;;
            09*|10*) EMOJI="🌧️" ;;
            11*) EMOJI="⛈️" ;;
            13*) EMOJI="❄️" ;;
            50*) EMOJI="🌫️" ;;
          esac

          SUMMARY=$(cat <<'EOF'
          **{CITY_NAME} の天気** {EMOJI}

          - 概況: {DESC}
          - 気温: {TEMP}℃（体感 {FEELS}℃）
          - 湿度: {HUMI}% / 風速: {WIND} m/s
          EOF
          )

          SUMMARY="${SUMMARY//\{CITY_NAME\}/$NAME}"
          SUMMARY="${SUMMARY//\{EMOJI\}/$EMOJI}"
          SUMMARY="${SUMMARY//\{DESC\}/$DESC}"
          SUMMARY="${SUMMARY//\{TEMP\}/$TEMP}"
          SUMMARY="${SUMMARY//\{FEELS\}/$FEELS}"
          SUMMARY="${SUMMARY//\{HUMI\}/$HUMI}"
          SUMMARY="${SUMMARY//\{WIND\}/$WIND}"

          START_COUNT="$(grep -c '<!-- WEATHER-START -->' README.md || true)"
          END_COUNT="$(grep -c '<!-- WEATHER-END -->' README.md || true)"
          if [[ "${START_COUNT}" -ne 1 || "${END_COUNT}" -ne 1 ]]; then
            echo "::error title=Invalid README::Weather section markers must each appear exactly once."
            exit 1
          fi

          sed -n '1,/<!-- WEATHER-START -->/p' README.md > /tmp/part1.txt
          sed -n '/<!-- WEATHER-END -->/,$p' README.md > /tmp/part2.txt
          { cat /tmp/part1.txt; printf '%s\n' "$SUMMARY"; cat /tmp/part2.txt; } > README.md

      - name: Commit changes if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md
          git commit -m "chore: update weather"
          git push
